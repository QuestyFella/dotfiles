<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .pane { right: 24px; top: 50%; translate: 0 -50%; width: 480px; --hinge: right center; --enter: swing-in-right; --leave: swing-out-right; }
  .cores { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; }
  .meter { white-space: pre; }
  .meter .lbl { color: var(--a2); }
  .lo { color: var(--a4); } .mid { color: var(--warn); } .hi { color: var(--red); }
  .val { color: var(--sub); }
  .sep { height: 6px; }
  .info { display: flex; justify-content: space-between; color: var(--sub); }
  .info b { color: var(--fg); font-weight: 400; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th { background: var(--accent); color: var(--bg); text-align: right; font-weight: 700; padding: 0 6px; }
  td { text-align: right; padding: 0 6px; }
  th:last-child, td:last-child { text-align: left; width: 100%; }
  td:last-child { max-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr:nth-child(2) td { color: var(--accent); } /* busiest process */
  .wait { padding: 20px 0; }
</style></head>
<body>
<div class="pane">
  <div class="tag" id="tag"><span class="glyph">▤</span>htop</div>
  <div class="close">[x]</div>
  <div id="body"><div class="wait sub">sampling <span class="cursor"></span></div></div>
  <div class="hint">⌃⌥⌘h</div>
</div>
<script src="base.js"></script>
<script>
  const GB = 2 ** 30;
  const human = (b) => b >= GB ? (b / GB).toFixed(1) + "G" : b >= 2 ** 20 ? (b / 2 ** 20).toFixed(0) + "M" : (b / 1024).toFixed(0) + "K";
  const rate = (b) => b == null ? "—" : b >= 2 ** 20 ? (b / 2 ** 20).toFixed(1) + " MB/s" : (b / 1024).toFixed(0) + " KB/s";
  const lvl = (p) => p < 50 ? "lo" : p < 80 ? "mid" : "hi";

  // htop meter: Lbl[||||||      text]
  function meter(label, pct, text, width, colorPct = pct) { // colorPct: what decides green/yellow/red
    pct = Math.max(0, Math.min(100, pct || 0));
    const inner = width - 2, fill = Math.round(pct / 100 * inner);
    const t = text.slice(0, inner), bars = Math.min(fill, inner - t.length);
    const pad = inner - t.length - Math.max(bars, 0);
    return `<span class="lbl">${label}</span>[<span class="${lvl(colorPct || 0)}">${"|".repeat(Math.max(bars, 0))}</span>${" ".repeat(Math.max(pad, 0))}<span class="val">${t}</span>]`;
  }

  function update(d) {
    const cores = (d.cores || []).map((c, i) =>
      `<div class="meter">${meter(String(i + 1).padStart(2), c, c.toFixed(0) + "%", 19)}</div>`).join("");
    const up = d.uptime || 0, dd = Math.floor(up / 86400), hh = Math.floor(up % 86400 / 3600), mm = Math.floor(up % 3600 / 60);
    const b = d.battery || {}, bt = b.pct == null ? "n/a" : `${Math.round(b.pct)}%${b.charging ? " ⚡" : b.plugged ? " ⏻" : ""}`;
    document.getElementById("tag").innerHTML =
      `<span class="glyph">▤</span>htop · ${(d.cores || []).length} cores · up ${dd ? dd + "d " : ""}${hh}h ${mm}m`;
    const procs = (d.procs || []).map((p) =>
      `<tr><td>${p.pid}</td><td>${p.cpu.toFixed(1)}</td><td>${human(p.mem)}</td><td>${esc(p.cmd)}</td></tr>`).join("");
    document.getElementById("body").innerHTML = `
      <div class="cores">${cores}</div>
      <div class="sep"></div>
      <div class="meter">${meter("CPU", d.cpu, d.cpu.toFixed(1) + "%", 44)}</div>
      <div class="meter">${meter("Mem", d.memUsed / d.memTotal * 100, `${human(d.memUsed)}/${human(d.memTotal)}`, 44)}</div>
      <div class="meter">${meter("Swp", d.swapTotal ? d.swapUsed / d.swapTotal * 100 : 0, `${human(d.swapUsed || 0)}/${human(d.swapTotal || 0)}`, 44)}</div>
      <div class="meter">${meter("Dsk", d.diskUsed / d.diskTotal * 100, `${human(d.diskUsed)}/${human(d.diskTotal)}`, 44)}</div>
      <div class="meter">${meter("Bat", b.pct || 0, bt, 44, b.pct == null ? 0 : 100 - b.pct)}</div>
      <div class="sep"></div>
      <div class="info"><span>net <b>↓ ${rate(d.netDown)}</b>  <b>↑ ${rate(d.netUp)}</b></span>
        <span>load <b>${(d.load || []).map((x) => x.toFixed(2)).join(" ")}</b></span></div>
      <table><tr><th>PID</th><th>CPU%</th><th>MEM</th><th>COMMAND</th></tr>${procs}</table>`;
  }
</script>
</body></html>
